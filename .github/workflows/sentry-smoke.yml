name: Copilot e Sentry
on:
  workflow_call:
    inputs:
      config_path:
        type: string
        default: .github/patchwork.json
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  smoke:
    name: Consultar Sentry com Copilot
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Obter Patchwork
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - name: Obter aplicação
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: app
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Instalar Copilot CLI e MCP Sentry
        run: |
          npm install --global @github/copilot
          npm ci --ignore-scripts --omit=dev --prefix patchwork
      - name: Preparar consulta
        id: context
        run: node patchwork/scripts/patchwork.js smoke
        env:
          PATCHWORK_CONFIG: ${{ inputs.config_path }}
      - name: Consultar Sentry
        id: copilot
        working-directory: app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PATCHWORK_DIR: ${{ steps.context.outputs.directory }}
          PATCHWORK_TIMEOUT: 3m
        run: |
          set -euo pipefail
          cli_pid=""
          log_marker=$(cat /proc/sys/kernel/random/uuid)
          cleanup() {
            code=$?
            trap - EXIT INT TERM
            if [[ -n "$cli_pid" ]]; then
              kill -TERM -- "-$cli_pid" 2>/dev/null || true
              sleep 0.2
              kill -KILL -- "-$cli_pid" 2>/dev/null || true
              wait "$cli_pid" 2>/dev/null || true
            fi
            printf '\n::%s::\n' "$log_marker"
            exit "$code"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export COPILOT_HOME="$PATCHWORK_DIR/home"
          export COPILOT_SKILLS_DIRS="$COPILOT_HOME/skills"
          # Mostrar o prompt e a saída normal, sem interpretar seu texto como comandos do Actions.
          echo "::stop-commands::$log_marker"
          printf 'Prompt enviado ao Copilot:\n\n'
          cat "$PATCHWORK_DIR/prompt.md"
          printf '\n\n'
          args=(-p "$(cat "$PATCHWORK_DIR/prompt.md")" --no-color --no-ask-user
            --stream on --log-level none --add-dir "$COPILOT_SKILLS_DIRS"
            --disable-builtin-mcps --additional-mcp-config "@$PATCHWORK_DIR/mcp.json"
            --allow-tool read --allow-tool write --allow-tool shell --allow-tool sentry
            --deny-tool 'shell(git push)' --deny-tool 'shell(git commit)')
          if [[ -n "${COPILOT_MODEL:-}" ]]; then args+=(--model "$COPILOT_MODEL"); fi
          # Um grupo de processos permite encerrar também comandos iniciados pelo CLI.
          # As variáveis são expandidas pelo bash filho.
          # shellcheck disable=SC2016
          setsid bash -c 'set -o pipefail; timeout --foreground --kill-after=5s "$PATCHWORK_TIMEOUT" copilot "$@" | tee "$PATCHWORK_DIR/response.json"' bash "${args[@]}" &
          cli_pid=$!
          wait "$cli_pid"
      - name: Mostrar resultado
        run: node patchwork/scripts/patchwork.js smoke-result
        env:
          PATCHWORK_DIR: ${{ steps.context.outputs.directory }}
      - name: Limpar temporários
        if: always()
        env:
          PATCHWORK_DIR: ${{ steps.context.outputs.directory }}
        run: |
          if [[ -n "$PATCHWORK_DIR" ]]; then node patchwork/scripts/patchwork.js cleanup; fi
