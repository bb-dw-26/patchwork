name: Copilot e MCP Sentry
on:
  workflow_call:
    inputs:
      config_path:
        type: string
        default: .github/patchwork.json
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    permissions:
      contents: read
      copilot-requests: write
    env:
      PATCHWORK_CONFIG: ${{ inputs.config_path }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.workflow_sha }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --omit=dev
        working-directory: patchwork
      - name: Preparar skill e MCP do consumidor
        run: node patchwork/scripts/sentry-smoke.mjs prepare
      - name: Consultar Sentry pelo agente isolado
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bash patchwork/scripts/run-agent.sh
      - name: Conferir invocação da skill e consulta concluída
        run: node patchwork/scripts/sentry-smoke.mjs verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sentry-smoke
          path: |
            ${{ runner.temp }}/agent-context.json
            ${{ runner.temp }}/execution.json
            ${{ runner.temp }}/report.md
          retention-days: 7
