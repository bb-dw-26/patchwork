name: Patchwork
on:
  workflow_call:
    inputs:
      issue_number:
        description: Número da issue do incidente
        required: true
        type: string
      config_path:
        description: Configuração do consumidor
        type: string
        default: .github/patchwork.json
      node_version:
        type: string
        default: '24'
      go_version_file:
        type: string
        default: ''
      install_command:
        description: Instalação da aplicação, antes do Copilot
        type: string
        default: npm ci
      check_command:
        description: Verificação executada uma vez após a correção
        type: string
        default: npm run check
      copilot_model:
        type: string
        default: ''
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
      PATCHWORK_PUBLISH_APP_PRIVATE_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: patchwork-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  repair:
    name: Investigar, verificar e publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
      copilot-requests: write
    env:
      PATCHWORK_CONFIG: ${{ inputs.config_path }}
    steps:
      - name: Obter Patchwork
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: patchwork
          persist-credentials: false
      - name: Obter aplicação
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          path: app
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node_version }}
      - name: Instalar Copilot CLI e MCP Sentry
        run: |
          npm install --global @github/copilot
          npm ci --ignore-scripts --omit=dev --prefix patchwork
      - name: Preparar contexto
        id: context
        run: node patchwork/scripts/patchwork.js prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PATCHWORK_PUBLISH_APP_CLIENT_ID: ${{ vars.PATCHWORK_PUBLISH_APP_CLIENT_ID }}
      - name: Preparar Go
        if: steps.context.outputs.skip != 'true' && inputs.go_version_file != ''
        uses: actions/setup-go@v6
        with:
          go-version-file: app/${{ inputs.go_version_file }}
          cache: false
      - name: Instalar aplicação
        if: steps.context.outputs.skip != 'true'
        working-directory: app
        run: ${{ inputs.install_command }}
      - name: Investigar e corrigir com Copilot
        if: steps.context.outputs.skip != 'true'
        id: copilot
        working-directory: app
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENTRY_ACCESS_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          COPILOT_MODEL: ${{ inputs.copilot_model }}
          PATCHWORK_DIR: ${{ steps.context.outputs.directory }}
          PATCHWORK_TIMEOUT: 15m
        run: |
          set -euo pipefail
          cli_pid=""
          log_marker=$(cat /proc/sys/kernel/random/uuid)
          cleanup() {
            code=$?
            trap - EXIT INT TERM
            if [[ -n "$cli_pid" ]]; then
              kill -TERM -- "-$cli_pid" 2>/dev/null || true
              sleep 0.2
              kill -KILL -- "-$cli_pid" 2>/dev/null || true
              wait "$cli_pid" 2>/dev/null || true
            fi
            printf '\n::%s::\n' "$log_marker"
            exit "$code"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export COPILOT_HOME="$PATCHWORK_DIR/home"
          export COPILOT_SKILLS_DIRS="$COPILOT_HOME/skills"
          # Mostrar o prompt e a saída normal, sem interpretar seu texto como comandos do Actions.
          echo "::stop-commands::$log_marker"
          printf 'Prompt enviado ao Copilot:\n\n'
          cat "$PATCHWORK_DIR/prompt.md"
          printf '\n\n'
          args=(-p "$(cat "$PATCHWORK_DIR/prompt.md")" --no-color --no-ask-user
            --stream on --log-level none --add-dir "$COPILOT_SKILLS_DIRS"
            --disable-builtin-mcps --additional-mcp-config "@$PATCHWORK_DIR/mcp.json"
            --allow-tool read --allow-tool write --allow-tool shell --allow-tool sentry
            --deny-tool 'shell(git push)' --deny-tool 'shell(git commit)')
          if [[ -n "${COPILOT_MODEL:-}" ]]; then args+=(--model "$COPILOT_MODEL"); fi
          # Um grupo de processos permite encerrar também comandos iniciados pelo CLI.
          # As variáveis são expandidas pelo bash filho.
          # shellcheck disable=SC2016
          setsid bash -c 'set -o pipefail; timeout --foreground --kill-after=5s "$PATCHWORK_TIMEOUT" copilot "$@" | tee "$PATCHWORK_DIR/response.json"' bash "${args[@]}" &
          cli_pid=$!
          wait "$cli_pid"
      - name: Ler resultado
        if: steps.context.outputs.skip != 'true'
        id: result
        run: node patchwork/scripts/patchwork.js result
        env:
          PATCHWORK_CONTEXT: ${{ steps.context.outputs.context }}
          PATCHWORK_DIR: ${{ steps.context.outputs.directory }}
      - name: Verificar aplicação
        if: steps.result.outputs.outcome == 'repair'
        id: check
        timeout-minutes: 8
        working-directory: app
        run: ${{ inputs.check_command }}
      - name: Autorizar publicação do PR
        if: steps.result.outputs.outcome == 'repair' && steps.check.outcome == 'success'
        id: publisher
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PATCHWORK_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PATCHWORK_PUBLISH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Abrir PR em rascunho
        if: steps.result.outputs.outcome == 'repair' && steps.check.outcome == 'success'
        run: node patchwork/scripts/patchwork.js publish
        env:
          GH_TOKEN: ${{ steps.publisher.outputs.token }}
          PATCHWORK_APP_SLUG: ${{ steps.publisher.outputs.app-slug }}
          PATCHWORK_CHECK_STATUS: ${{ steps.check.outcome }}
          PATCHWORK_CHECK_COMMAND: ${{ inputs.check_command }}
          PATCHWORK_CONTEXT: ${{ steps.context.outputs.context }}
          PATCHWORK_RESULT: ${{ steps.result.outputs.result }}
      - name: Autorizar encaminhamento
        if: steps.result.outputs.outcome == 'handoff'
        id: forwarder
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PATCHWORK_PUBLISH_APP_CLIENT_ID }}
          private-key: ${{ secrets.PATCHWORK_PUBLISH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.result.outputs.repositories }}
          permission-issues: write
      - name: Criar issue vinculada
        if: steps.result.outputs.outcome == 'handoff'
        run: node patchwork/scripts/patchwork.js handoff
        env:
          GH_TOKEN: ${{ steps.forwarder.outputs.token }}
          PATCHWORK_APP_SLUG: ${{ steps.forwarder.outputs.app-slug }}
          PATCHWORK_CONTEXT: ${{ steps.context.outputs.context }}
          PATCHWORK_RESULT: ${{ steps.result.outputs.result }}
      - name: Encerrar execução
        if: always()
        env:
          PATCHWORK_DIR: ${{ steps.context.outputs.directory }}
          RESULT: ${{ job.status }}
          CHECK_STATUS: ${{ steps.check.outcome }}
          CHECK_COMMAND: ${{ inputs.check_command }}
        run: |
          if [[ -n "$PATCHWORK_DIR" ]]; then node patchwork/scripts/patchwork.js cleanup; fi
          if [[ "$CHECK_STATUS" == success ]]; then
            # Cercas Markdown literais no resumo.
            # shellcheck disable=SC2016
            printf '\nVerificação aprovada:\n```sh\n%s\n```\n' "$CHECK_COMMAND" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CHECK_STATUS" == failure ]]; then
            # shellcheck disable=SC2016
            printf '\nVerificação reprovada; publicação impedida:\n```sh\n%s\n```\n' "$CHECK_COMMAND" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nVerificação da aplicação não executada.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '\nResultado da execução: %s\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
