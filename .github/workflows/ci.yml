name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verificar Patchwork
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Instalar dependências
        run: npm ci --ignore-scripts
      - name: Testar fluxo com CLI e APIs simulados
        run: npm test
      - name: Preparar Go para actionlint
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Validar workflows
        # Catálogo do actionlint ainda não reconhece estes recursos do GitHub.
        # Inputs do App: https://github.com/actions/create-github-app-token/blob/v3/action.yml
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          -ignore 'property "(workflow_repository|workflow_sha)" is not defined'
          -ignore 'unknown permission scope "copilot-requests"'
          -ignore '^missing input "app-id" which is required by action "actions/create-github-app-token@v3"\.'
          -ignore '^input "client-id" is not defined in action "actions/create-github-app-token@v3"\.'
          .github/workflows/*.yml examples/consumer.yml
